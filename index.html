<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小yan吃不胖</title>
  <style>
    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      background: #f6f3fb;
      font-family: system-ui, sans-serif;
    }

    h1 {
      position: fixed;
      z-index: 100000;
      left: 50%;
      bottom: calc(4dvh + var(--model-height, 65dvh) + 6px);
      transform: translateX(-50%);
      margin: 0;
      padding: 6px 18px;
      border: 1px solid #f2d5cb;
      border-radius: 999px;
      background: #fff1e9;
      color: #864f55;
      box-shadow: 0 3px 12px #864f551a;
      font-size: clamp(16px, 3vw, 22px);
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
    }

    #live2d-widget {
      right: auto !important;
      left: 50% !important;
      bottom: 4dvh !important;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <h1>小yan吃不胖</h1>

  <script src="https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
  <script>
    if (window.L2Dwidget) {
      const viewport = document.documentElement;
      const nameHeight = document.querySelector("h1").offsetHeight;
      const availableHeight = viewport.clientHeight - nameHeight;
      const height = Math.max(1, Math.floor(availableHeight * 0.72));
      const width = Math.max(
        1,
        Math.min(Math.floor(height * 0.64), viewport.clientWidth)
      );

      viewport.style.setProperty("--model-height", `${height}px`);

      window.L2Dwidget.init({
        model: {
          jsonPath: "https://cdn.jsdelivr.net/npm/live2d-widget-model-shizuku@1.0.5/assets/shizuku.model.json"
        },
        display: {
          position: "right",
          width,
          height,
          hOffset: 0,
          vOffset: 0
        },
        mobile: { show: true, scale: 1 },
        react: { opacityDefault: 1, opacityOnHover: 1 }
      });
    }
  </script>
</body>
</html>
