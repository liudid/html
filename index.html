<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小yan吃不胖</title>
  <style>
    body {
      margin: 0;
      background: #f6f3fb;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(540px, calc(100% - 32px));
      margin: 5dvh auto 0;
      text-align: center;
    }

    h1 {
      display: inline-block;
      margin: 0 0 8px;
      padding: 6px 18px;
      border: 1px solid #f2d5cb;
      border-radius: 999px;
      background: #fff1e9;
      color: #864f55;
      box-shadow: 0 3px 12px #864f551a;
      font-size: 18px;
    }

    #portrait { height: 72dvh; }
    canvas { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>小yan吃不胖</h1>
    <div id="portrait"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/live2d-widgets@1.0.1/dist/live2d.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism2.min.js"></script>
  <script>
    async function showIzumi() {
      const portrait = document.querySelector("#portrait");
      const app = new PIXI.Application({
        backgroundAlpha: 0,
        antialias: true
      });

      const model = await PIXI.live2d.Live2DModel.from(
        "https://raw.githubusercontent.com/zenghongtu/live2d-model-assets/master/assets/moc/izumi/izumi.model.json"
      );

      const modelWidth = model.width;
      const modelHeight = model.height;
      model.anchor.set(0.5);
      app.stage.addChild(model);
      portrait.append(app.view);

      function fitModel() {
        const width = portrait.clientWidth;
        const height = portrait.clientHeight;
        const scale = Math.min(width / modelWidth, height / modelHeight);

        app.renderer.resize(width, height);
        model.scale.set(scale * 0.96);
        model.position.set(width / 2, height / 2);
      }

      fitModel();
      new ResizeObserver(fitModel).observe(portrait);
    }

    showIzumi().catch(console.error);
  </script>
</body>
</html>
